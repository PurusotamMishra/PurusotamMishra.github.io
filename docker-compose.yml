services:

  bloo-agent:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: bloo-agent
    container_name: bloo-agent
    volumes:
      - ./server:/app/server
    env_file:
      - .env
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - agent-network

  client-agent:
    build:
      context: .
      dockerfile: Dockerfile.client
    image: client-agent
    container_name: client-agent
    volumes:
      - ./client:/app/client
    environment:
      - EXTERNAL_AGENT_URLS=http://bloo-agent:8080
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - GOOGLE_GENAI_USE_VERTEXAI=FALSE
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    env_file:
      - .env
    ports:
      - "8081:80"
    restart: unless-stopped
    depends_on:
      - bloo-agent
    networks:
      - agent-network
    
  bloo-mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: bloo-mcp-server
    ports:
      - "8000:80"
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - agent-network

networks:
  agent-network:
    driver: bridge
